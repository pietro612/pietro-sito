<main class="form-container">
    <h1>Contatto</h1>
    <p>Se desideri scrivermi direttamente, puoi farlo da qui. Risponderò con attenzione e rispetto.</p>

    <form action="https://formspree.io/f/mjkvzjpj" method="POST">

        <label for="messaggio">Il tuo messaggio:</label>
        <textarea id="messaggio" name="messaggio" required></textarea>

        <label for="email">La tua email (opzionale):</label>
        <input type="email" id="email" name="_replyto" placeholder="nome@example.com">

        <label for="telefono">Il tuo numero (opzionale):</label>
        <input type="tel" id="telefono" name="telefono" placeholder="123 456 7890">

        <label>Come preferisci essere ricontattato:</label>
        <div class="contatto-opzioni">
            <label><input type="radio" name="preferenza" value="email"> Email</label>
            <label><input type="radio" name="preferenza" value="sms"> SMS</label>
            <label><input type="radio" name="preferenza" value="nessuno" checked> Nessun contatto</label>
        </div>

        <button type="submit" class="submit-btn">Invia</button>
    </form>
</main>
