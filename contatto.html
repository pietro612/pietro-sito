<!-- IMMAGINE HERO -->
<img src="hero-contatto.jpg" alt="Contatto" class="header-image">

<!-- PULSANTE AUDIO (sotto l’immagine) -->
<button id="audio-btn" class="audio-button">♫</button>
<audio id="audio-player" src="musica.mp3"></audio>

<!-- CONTENUTO DELLA PAGINA -->
<main>
    <h1>Contatto</h1>
    <p>Se desideri scrivermi direttamente, puoi farlo tramite il modulo qui sotto.</p>

    <form action="grazie.html" method="POST" class="form-container">
        <label for="nome">Il tuo nome:</label>
        <input type="text" id="nome" name="nome" required>

        <label for="email">La tua email:</label>
        <input type="email" id="email" name="email" required>

        <label for="messaggio">Il tuo messaggio:</label>
        <textarea id="messaggio" name="messaggio" required></textarea>

        <button type="submit" class="submit-btn">Invia</button>
    </form>
</main>

<!-- SCRIPT AUDIO -->
<script>
const audioBtn = document.getElementById("audio-btn");
const audioPlayer = document.getElementById("audio-player");

audioBtn.addEventListener("click", () => {
  if (audioPlayer.paused) {
    audioPlayer.play();
    audioBtn.textContent = "❚❚";
  } else {
    audioPlayer.pause();
    audioBtn.textContent = "♫";
  }
});
</script>

</body>
