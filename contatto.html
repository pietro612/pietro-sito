    <h1>Contatto diretto</h1>

    <p>Se preferisci scrivermi in modo diretto, puoi farlo da qui.  
    Ogni messaggio viene letto con attenzione e riservatezza.</p>

    <form action="https://formspree.io/f/mqakjvjn" method="POST" class="contact-form">
        <label for="message">Il tuo messaggio</label>
        <textarea id="message" name="message" required></textarea>

        <label for="email">Email (facoltativa)</label>
        <input type="email" id="email" name="email" placeholder="Se vuoi una risposta diretta">

        <button type="submit" class="button">Invia</button>
    </form>
