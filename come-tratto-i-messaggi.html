<button id="audio-btn" class="audio-button">♫</button>
<audio id="audio-player" src="musica.mp3"></audio>

<!-- CONTENUTO DELLA PAGINA -->
<main>
    <h1>Come tratto i messaggi</h1>
    <p>Ogni messaggio viene accolto con rispetto, attenzione e riservatezza.  
       Rispondo con cura, senza giudizio, e con l’intenzione di offrire uno spazio sicuro.</p>
</main>

<!-- SCRIPT AUDIO -->
<script>
const audioBtn = document.getElementById("audio-btn");
const audioPlayer = document.getElementById("audio-player");

audioBtn.addEventListener("click", () => {
  if (audioPlayer.paused) {
    audioPlayer.play();
    audioBtn.textContent = "❚❚";
  } else {
    audioPlayer.pause();
    audioBtn.textContent = "♫";
  }
});
</script>
