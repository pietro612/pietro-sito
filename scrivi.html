<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

    <title>Scrivi una domanda</title>
    <meta name="description" content="Scrivi una domanda in modo semplice e privato. Rispondo personalmente, via email o cellulare.">

    <meta name="theme-color" content="#245f89">

    <!-- Canonical -->
    <link rel="canonical" href="https://domandedeigiovani.it/scrivi.html">

    <!-- Open Graph -->
    <meta property="og:title" content="Scrivi una domanda">
    <meta property="og:description" content="Scrivi una domanda in modo semplice e privato. Rispondo personalmente, via email o cellulare.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://domandedeigiovani.it/scrivi.html">
    <meta property="og:image" content="https://domandedeigiovani.it/immagini/hero-scrivi.jpg">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Scrivi una domanda">
    <meta name="twitter:description" content="Scrivi una domanda in modo semplice e privato. Rispondo personalmente, via email o cellulare.">
    <meta name="twitter:image" content="https://domandedeigiovani.it/immagini/hero-scrivi.jpg">

    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style-v2.css">

    <style>
        textarea {
            width: 100%;
            min-height: 260px;
            line-height: 1.5;
            resize: none;
            padding: 12px;
            font-size: 1rem;
            border-radius: 6px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
    </style>
</head>

<body>

    <!-- HERO -->
    <section class="hero">
        <img src="immagini/hero-scrivi.jpg" alt="Scrivi una domanda" class="hero-image">
        <div class="hero-overlay"></div>
        <div class="hero-text">
            <h1>Scrivi una domanda</h1>
            <p>In modo semplice, privato e senza giudizio.</p>
        </div>
    </section>

    <!-- CONTENUTO -->
    <main class="contenuto">

        <h2>Il tuo spazio di parola</h2>
        <p>Puoi scrivere liberamente ciò che desideri. Leggo personalmente ogni messaggio e rispondo nel modo che preferisci.</p>

        <form action="https://formspree.io/f/mqakjvkd" method="POST">

            <label for="nome">Il tuo nome (facoltativo)</label>
            <input type="text" id="nome" name="nome">

            <label for="email">La tua email (se vuoi risposta via email)</label>
            <input type="email" id="email" name="email">

            <label for="telefono">Il tuo cellulare (se preferisci SMS o WhatsApp)</label>
            <input type="tel" id="telefono" name="telefono">

            <label for="messaggio">La tua domanda</label>
            <textarea id="messaggio" name="messaggio" required></textarea>

            <button type="submit" class="cta">Invia</button>
        </form>

    </main>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 Domande dei Giovani</p>
        <a href="index.html">Home</a>
    </footer>

    <!-- AUTO-RESIZE DELLA TEXTAREA -->
    <script>
    document.addEventListener('input', function (e) {
        if (e.target.tagName.toLowerCase() === 'textarea') {
            e.target.style.height = 'auto';
            e.target.style.height = (e.target.scrollHeight) + 'px';
        }
    });
    </script>

</body>
</html>
