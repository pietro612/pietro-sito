<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="logo">Domande dei Giovani</div>
    <button class="hamburger" onclick="toggleMenu()">☰</button>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="perche.html">Perché esiste</a></li>
      <li><a href="come-funziona.html">Come funziona</a></li>
      <li><a href="come-tratto-i-messaggi.html">Come tratto i messaggi</a></li>
      <li><a href="scrivi.html" class="active">Scrivi una domanda</a></li>
      <li><a href="contatto.html">Contatto</a></li>
      <li><a href="chi-sono.html">Chi sono</a></li>
      <li><a href="faq.html">FAQ</a></li>
    </ul>
  </header>

  <!-- IMMAGINE GRANDE -->
  <img src="immagini/hero-scrivi.jpg" alt="Scrivi una domanda" class="header-image">

  <!-- CONTENUTO -->
  <div class="container">
    <h1>SCRIVI UNA DOMANDA</h1>

    <p>
      Puoi scrivere la tua domanda in modo anonimo.  
      Se vuoi ricevere una risposta, puoi indicare come preferisci.
    </p>

    <form action="https://formspree.io/f/xvzwobdy?redirect=https://pietro612.github.io/grazie.html" method="POST">

      <label for="domanda">La tua domanda</label>
      <textarea id="domanda" name="domanda" required></textarea>

      <label for="email">Email (opzionale)</label>
      <input type="email" id="email" name="email">

      <label for="telefono">Numero di cellulare (opzionale)</label>
      <input type="tel" id="telefono" name="telefono">

      <label for="risposta">Come vuoi ricevere la risposta?</label>
      <select id="risposta" name="risposta">
        <option value="email">Email</option>
        <option value="telefono">Telefono</option>
        <option value="nessuna">Non voglio risposta</option>
      </select>

      <button type="submit" class="cta">Invia</button>
    </form>
  </div>

  <!-- FOOTER -->
  <footer>
    <p>© 2025 Pietro</p>
  </footer>

  <script>
    function toggleMenu() {
      document.getElementById("navLinks").classList.toggle("open");
    }
  </script>

</body>
