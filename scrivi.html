<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

<body>
  <header>
    <nav>
      <a href="index.html">Home</a>
      <a href="scrivi.html" class="active">Scrivi</a>
      <a href="contatto.html">Contatto</a>
      <a href="faq.html">FAQ</a>
    </nav>
  </header>

  <main>
    <h1>Scrivi una domanda</h1>
    <p>Puoi scrivere la tua domanda in modo anonimo. Se vuoi ricevere una risposta, puoi indicare come.</p>

    <form action="https://formspree.io/f/mzbqgqkd" method="POST">

      <label for="messaggio">La tua domanda</label>
      <textarea id="messaggio" name="messaggio" required></textarea>

      <label for="email">Email (opzionale)</label>
      <input type="email" id="email" name="email">

      <label for="telefono">Numero di cellulare (opzionale)</label>
      <input type="tel" id="telefono" name="telefono" placeholder="+39 ...">

      <label for="preferenza">Come vuoi ricevere la risposta?</label>
      <select id="preferenza" name="preferenza" required>
        <option value="email">Email</option>
        <option value="sms">SMS</option>
        <option value="whatsapp">WhatsApp</option>
      </select>

      <button type="submit">Invia</button>

    </form>
  </main>

  <footer>
    <p>© 2025 Pietro</p>
  </footer>
</body>
</html>
