<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Scrivi una domanda</title>
    <meta name="description" content="Scrivi la tua domanda in modo privato. Nessun giudizio, solo ascolto.">

    <meta name="theme-color" content="#245f89">

    <!-- Canonical -->
    <link rel="canonical" href="https://domandedeigiovani.it/scrivi.html">

    <!-- Open Graph -->
    <meta property="og:title" content="Scrivi una domanda">
    <meta property="og:description" content="Scrivi la tua domanda in modo privato. Nessun giudizio, solo ascolto.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://domandedeigiovani.it/scrivi.html">
    <meta property="og:image" content="https://domandedeigiovani.it/immagini/hero-scrivi.jpg">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Scrivi una domanda">
    <meta name="twitter:description" content="Scrivi la tua domanda in modo privato. Nessun giudizio, solo ascolto.">
    <meta name="twitter:image" content="https://domandedeigiovani.it/immagini/hero-scrivi.jpg">

    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style-v2.css">
</head>

<body>

    <!-- HERO -->
    <section class="hero">
        <img src="immagini/hero-scrivi.jpg" alt="Scrivi una domanda" class="hero-image">
        <div class="hero-overlay"></div>
        <div class="hero-text">
            <h1>Scrivi una domanda</h1>
            <p>Puoi farlo in modo privato. Nessun giudizio, solo ascolto.</p>
        </div>
    </section>

    <!-- FORM -->
    <main class="contenuto">
        <form action="https://formspree.io/f/mqakjvqp" method="POST" class="form">

            <label for="message">La tua domanda</label>
            <textarea id="message" name="message" required></textarea>

            <label for="contact-method">Come vuoi essere ricontattato?</label>
            <select id="contact-method" name="contact-method" required>
                <option value="">Scegli un’opzione</option>
                <option value="email">Email</option>
                <option value="phone">Cellulare (SMS o WhatsApp)</option>
            </select>

            <div id="email-field" style="display:none;">
                <label for="email">La tua email</label>
                <input type="email" id="email" name="email">
            </div>

            <div id="phone-field" style="display:none;">
                <label for="phone">Il tuo numero</label>
                <input type="tel" id="phone" name="phone">
            </div>

            <input type="hidden" name="_redirect" value="https://domandedeigiovani.it/grazie.html">

            <button type="submit" class="cta">Invia</button>
        </form>
    </main>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 Domande dei Giovani</p>
        <a href="index.html">Home</a>
    </footer>

    <!-- SCRIPT PER MOSTRARE I CAMPI GIUSTI -->
    <script>
        const select = document.getElementById('contact-method');
        const emailField = document.getElementById('email-field');
        const phoneField = document.getElementById('phone-field');

        select.addEventListener('change', function() {
            emailField.style.display = this.value === 'email' ? 'block' : 'none';
            phoneField.style.display = this.value === 'phone' ? 'block' : 'none';
        });
    </script>

</body>
</html>
