</main>

<script>
const audioBtn = document.getElementById("audio-btn");
const audioPlayer = document.getElementById("audio-player");

audioBtn.addEventListener("click", () => {
  if (audioPlayer.paused) {
    audioPlayer.play();
    audioBtn.textContent = "❚❚";
  } else {
    audioPlayer.pause();
    audioBtn.textContent = "♫";
  }
});
</script>
